<section class="process" aria-labelledby="process-title">
  <div class="section-heading">
    <p class="eyebrow">{{ t('process.eyebrow') }}</p>
    <h2 id="process-title">{{ t('process.title') }}</h2>
  </div>
  <p class="process-lead">{{ t('process.lead') }}</p>

  <div class="overlay-cards">
    @for (card of cards(); track card.titleKey) {
      <article class="overlay-card" [style.background-image]="'url(' + card.image + ')'">
        <div class="overlay-card-body">
          <h3>{{ t(card.titleKey) }}</h3>
          <p>{{ t(card.textKey) }}</p>
          <a href="#">{{ t('process.more') }}</a>
        </div>
      </article>
    }
  </div>
</section>
