<header class="site-header" [class.is-open]="menuOpen()">
  <a class="brand" routerLink="/" [attr.aria-label]="t('header.homeAria')" (click)="closeMenu()">
    <img
      [src]="logo()"
      [alt]="t('header.brandAlt')"
      width="167"
      height="80"
      referrerpolicy="no-referrer"
    />
    <span class="brand-anniversary" [attr.aria-label]="t('header.anniversaryAria')"
      >99<small>{{ t('header.anniversaryLabel') }}</small></span
    >
  </a>

  <nav class="main-nav" [attr.aria-label]="t('header.navAria')">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ t(item.labelKey) }}</a
      >
    }
  </nav>

  <div class="header-actions" [attr.aria-label]="t('header.quickAccessAria')">
    <div class="lang" role="group" [attr.aria-label]="t('header.langAria')">
      @for (lang of languages; track lang) {
        <button
          type="button"
          class="lang-btn"
          [class.active]="lang === currentLang()"
          [attr.aria-pressed]="lang === currentLang()"
          (click)="selectLang(lang)"
        >
          {{ langLabels[lang] }}
        </button>
      }
    </div>
    <button type="button" [attr.aria-label]="t('header.search')">⌕</button>
    <button type="button" [attr.aria-label]="t('header.wishlist')">♡</button>
    <button
      type="button"
      class="nav-toggle"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="t('header.toggleNav')"
      (click)="toggleMenu()"
    >
      ☰
    </button>
  </div>
</header>
