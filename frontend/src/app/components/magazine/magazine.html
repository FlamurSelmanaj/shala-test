<section class="magazine-section" aria-labelledby="magazine-title">
  <div class="section-heading">
    <p class="eyebrow">KANN-Magazin</p>
    <h2 id="magazine-title">Aktuelle Gartenthemen</h2>
    <a class="magazine-all" href="#">Alle Artikel lesen</a>
  </div>

  <div class="magazine-grid">
    @for (article of magazineArticles; track article.title) {
      <a class="magazine-card" href="#">
        <img [src]="article.image" [alt]="article.title" referrerpolicy="no-referrer" />
        <span class="magazine-tag">{{ article.category }}</span>
        <strong>{{ article.title }}</strong>
        <span class="magazine-more">Mehr erfahren ›</span>
      </a>
    }
  </div>
</section>
