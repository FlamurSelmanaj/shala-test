<section class="magazine-section" aria-labelledby="magazine-title">
  <div class="section-heading">
    <p class="eyebrow">{{ t('magazine.eyebrow') }}</p>
    <h2 id="magazine-title">{{ t('magazine.title') }}</h2>
    <a class="magazine-all" href="#">{{ t('magazine.all') }}</a>
  </div>

  <div class="magazine-grid">
    @for (article of magazineArticles(); track article.titleKey) {
      <a class="magazine-card" href="#">
        <img [src]="article.image" [alt]="t(article.titleKey)" referrerpolicy="no-referrer" />
        <span class="magazine-tag">{{ t(article.categoryKey) }}</span>
        <strong>{{ t(article.titleKey) }}</strong>
        <span class="magazine-more">{{ t('magazine.more') }}</span>
      </a>
    }
  </div>
</section>
