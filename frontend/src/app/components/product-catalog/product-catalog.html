<section class="catalog-section" aria-labelledby="catalog-title">
  <div class="catalog-inner">
    <p class="eyebrow">{{ t('categories.title') }}</p>
    <h2 id="catalog-title">{{ t('news.title') }}</h2>

    @for (group of groups(); track group.category.id) {
      <div class="catalog-group">
        <h3>
          <img [src]="group.category.icon" alt="" referrerpolicy="no-referrer" />
          {{ text(group.category.name) }}
        </h3>
        <div class="product-grid">
          @for (product of group.products; track product.id) {
            <article class="product-card">
              <img [src]="product.image" [alt]="text(product.name)" referrerpolicy="no-referrer" />
              <div class="product-body">
                <strong>{{ text(product.name) }}</strong>
                <p>{{ text(product.blurb) }}</p>
              </div>
            </article>
          }
        </div>
      </div>
    } @empty {
      <p class="catalog-empty">Noch keine Produkte.</p>
    }
  </div>
</section>
