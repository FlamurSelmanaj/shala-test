<section class="hero" [attr.aria-label]="t('hero.regionAria')">
  <div class="hero-track" [style.transform]="'translateX(-' + activeSlide() * 100 + '%)'">
    @for (slide of heroSlides(); track slide.titleKey; let i = $index) {
      <article
        class="hero-slide"
        [style.background-image]="'url(' + slide.image + ')'"
        [attr.aria-hidden]="activeSlide() === i ? null : true"
      >
        <div class="hero-copy">
          <p class="hero-kicker">{{ t(slide.subtitleKey) }}</p>
          <h1>{{ t(slide.titleKey) }}</h1>
          <a class="btn btn-primary" href="#">{{ t(slide.titleKey) }}</a>
        </div>
        @if (slide.badge) {
          <img
            class="hero-badge"
            [src]="slide.badge"
            [alt]="t(slide.titleKey)"
            referrerpolicy="no-referrer"
          />
        }
      </article>
    }
  </div>

  <button class="hero-nav prev" type="button" [attr.aria-label]="t('hero.prev')" (click)="prev()">
    ‹
  </button>
  <button class="hero-nav next" type="button" [attr.aria-label]="t('hero.next')" (click)="next()">
    ›
  </button>

  <div class="hero-dots" role="tablist" [attr.aria-label]="t('hero.chooseSlide')">
    @for (slide of heroSlides(); track slide.titleKey; let i = $index) {
      <button
        type="button"
        role="tab"
        [class.active]="activeSlide() === i"
        [attr.aria-selected]="activeSlide() === i"
        [attr.aria-label]="t(slide.titleKey)"
        (click)="goToSlide(i)"
      ></button>
    }
  </div>

  <p class="hero-legal">{{ t('hero.legal') }}</p>
</section>
