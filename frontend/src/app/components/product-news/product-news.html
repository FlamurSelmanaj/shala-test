<section class="news-band" aria-labelledby="news-title">
  <img [src]="newsImage()" [alt]="t('news.imageAlt')" referrerpolicy="no-referrer" />
  <div>
    <p class="eyebrow">{{ t('news.eyebrow') }}</p>
    <h2 id="news-title">{{ t('news.title') }}</h2>
    <p>{{ t('news.text') }}</p>
    <a class="btn btn-primary" href="#">{{ t('news.cta') }}</a>
  </div>
</section>
